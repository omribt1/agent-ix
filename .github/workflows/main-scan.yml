name: '🔎 PR-noia Main Branch Scan'

# Full-repo security scan of the default branch on every push to it. The listed
# branches only narrow which pushes start a run; the job-level `if` below is what
# pins it to the repo's actual default branch, whatever it is called.
on:
  push:
    branches: ['main', 'master']

# A newer push supersedes a scan still running for an older commit.
concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

jobs:
  scan:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: 'ubuntu-latest'
    # Full scans (architecture assessment + code review) take ~10-15 min, longer
    # on big repos; the scanner Job itself is capped at 60 min.
    timeout-minutes: 75
    permissions:
      contents: 'read'
      # Only used by the "Open issues" step, which runs in private repos only.
      issues: 'write'

    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@v4'
        with:
          fetch-depth: 1
          persist-credentials: 'false'

      - name: 'Set up Python'
        uses: 'actions/setup-python@v4'
        with:
          python-version: '3.11'

      - name: 'Install dependencies'
        run: |-
          python -m pip install --upgrade pip
          pip install requests

      - name: 'Upload the branch and wait for the scan'
        env:
          PRNOIA_SERVER_URL: '${{ vars.PRNOIA_SERVER_URL }}'
          PRNOIA_API_KEY: '${{ secrets.PRNOIA_API_KEY }}'
          GITHUB_REPOSITORY: '${{ github.repository }}'
          GITHUB_REF_NAME: '${{ github.ref_name }}'
          GITHUB_SHA: '${{ github.sha }}'
        run: |-
          python .github/scripts/prnoia_repo_scan.py

      # Private repos only: an issue in a public repo would disclose an unfixed
      # vulnerability. Set the repo variable PRNOIA_OPEN_ISSUES to 'false' to turn
      # it off. Issues are de-duplicated across scans and closed when fixed.
      - name: 'Open issues for critical/high findings'
        if: github.event.repository.private && vars.PRNOIA_OPEN_ISSUES != 'false'
        continue-on-error: true
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          GITHUB_REPOSITORY: '${{ github.repository }}'
          PRNOIA_SERVER_URL: '${{ vars.PRNOIA_SERVER_URL }}'
          PRNOIA_ISSUE_MIN_SEVERITY: '${{ vars.PRNOIA_ISSUE_MIN_SEVERITY }}'
          PRNOIA_ISSUE_CLOSE_AFTER: '${{ vars.PRNOIA_ISSUE_CLOSE_AFTER }}'
        run: |-
          python .github/scripts/prnoia_open_issues.py
